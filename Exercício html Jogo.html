<!DOCTYPE HTML>
<html lang="pt-br">

<head>
    <style>
        #div1 {
            width: 350px;
            height: 70px;
            padding: 10px;
            border: 1px solid #e7d20e;
            background-color: #e7d20e;
            display: inline-block;
        }
    </style>
    <STYle>
        #div2 {
            width: 350px;
            height: 70px;
            padding: 10px;
            border: 1px solid #e70e0e;
            background-color: #e70e0e;
            display: inline-block;
        }
    </STYle>
    <STYle>
        #div3 {
            width: 350px;
            height: 70px;
            padding: 10px;
            border: 1px solid blue;
            background-color: blue;
            display: inline-block;
        }
    </STYle>
    <script>
        function dragstartHandler(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function dragoverHandler(ev) {
            ev.preventDefault();
        }

        function dropHandler(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            ev.target.appendChild(document.getElementById(data));
        }

    </script>

</head>

<body>

    <h1>Jogo das Cores</h1>

    <h2>Ligue as cores</h2>
    <hr>
  
    <h1 id="h1" draggable="true" ondragstart="dragstartHandler(event)">Amarelo</h1><br>
    <h1 id="h1" draggable="true" ondragstart="dragstartHandler(event)">Vermelho</h1><br>
    <h1 id="h1" draggable="true" ondragstart="dragstartHandler(event)">Azul</h1><br>

    <div id="div1" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
    <div id="div2" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
    <div id="div3" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>


</body>

</html>
