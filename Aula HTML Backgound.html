<body style="background-image: url(Imagem/Snoopy.jpg); background-repeat: no-repeat;">
    <h1 style="font-size:10vw;">Responsive Text</h1>

<p style="font-size:5vw;">Resize the browser window to see how the text size scales.</p>

<p style="font-size:5vw; border: dashed; border: coral;">Use the "vw" unit when sizing the text. 10vw will set the size to 10% of the viewport width.</p>

<p style="border: dashed; border: color-mix(in srgb, color percentage, color percentage);">Viewport is the browser window size. 1vw = 1% of viewport width. If the viewport is 50cm wide, 1vw is 0.5cm.</p>

    

</body>
